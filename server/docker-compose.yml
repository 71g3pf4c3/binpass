# Local binpassd stack: PostgreSQL plus the server. All configuration is
# supplied via ENV so the entire setup is visible in one place.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: binpass
      POSTGRES_PASSWORD: binpass
      POSTGRES_DB: binpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  binpassd:
    build:
      context: .
      args:
        VERSION: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BINPASSD_PG_URL: "postgres://binpass:binpass@postgres:5432/binpass?sslmode=disable"
      BINPASSD_BLOB_FS_PATH: "/var/lib/binpassd/blobs"
      # Deterministic dev Ed25519 seed (base64 of 32 bytes). Replace in prod.
      BINPASSD_JWT_PRIVATE_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      BINPASSD_LOG_FORMAT: json
    ports:
      - "8080:8080"   # REST + swagger + metrics
      - "8081:8081"   # gRPC
    volumes:
      - blobs:/var/lib/binpassd/blobs

volumes:
  pgdata:
  blobs:
