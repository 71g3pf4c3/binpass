# GitLab CI for binpass: lint, test, coverage gate, cross-platform build.
# Mirrors .github/workflows/ci.yml but uses GitLab CI syntax.
# See 06-current-wip.md for design decisions.

stages:
  - lint
  - test
  - build
  - release

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  CGO_ENABLED: "0"

.go-cache: &go-cache
  cache:
    key: go-mod-${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/

.go-setup: &go-setup
  image: golang:1.26-bookworm
  before_script:
    - go version
    - go env GOPATH

# ---- Lint ----

go-vet:
  stage: lint
  <<: *go-setup
  <<: *go-cache
  script:
    - go vet ./...

gofmt:
  stage: lint
  <<: *go-setup
  script:
    - |
      unformatted=$(gofmt -l .)
      if [ -n "$unformatted" ]; then
        echo "Files not formatted:"
        echo "$unformatted"
        exit 1
      fi

golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest
  script:
    - golangci-lint run --timeout=5m ./...
  allow_failure: false

# ---- Test ----

unit-tests:
  stage: test
  <<: *go-setup
  <<: *go-cache
  script:
    - apt-get update && apt-get install -y --no-install-recommends pass gnupg tree age git
    - command -v pass || { echo "pass is missing: golden suite would skip"; exit 1; }
    - command -v tree || { echo "tree is missing: pass cannot render listings"; exit 1; }
    - go test -race ./...

coverage:
  stage: test
  <<: *go-setup
  <<: *go-cache
  script:
    - apt-get update && apt-get install -y --no-install-recommends pass gnupg tree age git
    - go test -coverpkg=./pkg/...,./internal/... -coverprofile=coverage.out ./...
    - grep -v -E '/mocks/|_mock\.go|/gen/' coverage.out > coverage.filtered || true
    - total=$(go tool cover -func=coverage.filtered | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
    - echo "business-logic coverage: ${total}%"
    - awk -v c="$total" 'BEGIN { exit (c+0 >= 70.0) ? 0 : 1 }' || { echo "coverage ${total}% below 70% threshold"; exit 1; }
  coverage: '/^total:\s+\S+\s+\S+\s+(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.filtered

# ---- Build ----

build-linux-amd64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=linux GOARCH=amd64 go build -trimpath -o binpass-linux-amd64 ./cmd/binpass
  artifacts:
    paths:
      - binpass-linux-amd64

build-linux-arm64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=linux GOARCH=arm64 go build -trimpath -o binpass-linux-arm64 ./cmd/binpass
  artifacts:
    paths:
      - binpass-linux-arm64

build-darwin-amd64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=darwin GOARCH=amd64 go build -trimpath -o binpass-darwin-amd64 ./cmd/binpass
  artifacts:
    paths:
      - binpass-darwin-amd64

build-darwin-arm64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=darwin GOARCH=arm64 go build -trimpath -o binpass-darwin-arm64 ./cmd/binpass
  artifacts:
    paths:
      - binpass-darwin-arm64

build-windows-amd64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=windows GOARCH=amd64 go build -trimpath -o binpass-windows-amd64.exe ./cmd/binpass
  artifacts:
    paths:
      - binpass-windows-amd64.exe

build-windows-arm64:
  stage: build
  <<: *go-setup
  <<: *go-cache
  script:
    - GOOS=windows GOARCH=arm64 go build -trimpath -o binpass-windows-arm64.exe ./cmd/binpass
  artifacts:
    paths:
      - binpass-windows-arm64.exe

# ---- Release ----
# Triggered by tags. Uses goreleaser with GitLab configuration.
# Requires GITLAB_TOKEN CI variable to be set.

release:
  stage: release
  image: golang:1.26-bookworm
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - go install github.com/goreleaser/goreleaser/v2@latest
    - goreleaser release --clean
  artifacts:
    paths:
      - dist/
