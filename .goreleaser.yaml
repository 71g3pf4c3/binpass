# GoReleaser configuration for the binpass client.
# Builds CGO-free, statically linked binaries for Linux, macOS, and Windows on
# amd64 and arm64, plus archives, checksums, and an SBOM.
# Docs: https://goreleaser.com
version: 2

project_name: binpass

before:
  hooks:
    - go mod tidy
    - mkdir -p completions

builds:
  - id: binpass
    main: ./cmd/binpass
    binary: binpass
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Shell completions are generated from the binary that will ship in the
    # package, so what the package installs always matches what `binpass
    # completion` would emit for that build. Only the host's own target is
    # executed: cross-compiled binaries cannot run here, and the completion
    # scripts a build emits do not depend on its architecture.
    hooks:
      post:
        - cmd: sh -c 'case "{{ .Target }}" in linux_amd64*) {{ .Path }} completion bash > ./completions/binpass.bash;; esac'
        - cmd: sh -c 'case "{{ .Target }}" in linux_amd64*) {{ .Path }} completion zsh > ./completions/_binpass;; esac'
        - cmd: sh -c 'case "{{ .Target }}" in linux_amd64*) {{ .Path }} completion fish > ./completions/binpass.fish;; esac'

archives:
  - id: binpass
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless signing through Sigstore: the signature is tied to this workflow's
# OIDC identity, so verification needs no key distributed out of band.
#
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp 'https://github.com/71g3pf4c3/binpass/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# Signing the checksum file covers every artefact listed in it.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Distribution packages.
nfpms:
  - id: binpass
    package_name: binpass
    vendor: 71g3pf4c3
    homepage: https://github.com/71g3pf4c3/binpass
    maintainer: 71g3pf4c3 <71g3pf4c3@gmail.com>
    description: |-
      A pass(1)-compatible password manager.
      Same storage format and command surface as pass, with age alongside GPG,
      hardware key support, and a built-in picker replacing rofi-pass/passmenu.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    # gnupg is only needed for .gpg stores, and age entries need nothing at
    # all, so it stays a recommendation rather than a hard dependency.
    recommends:
      - gnupg
    contents:
      - src: LICENSE
        dst: /usr/share/doc/binpass/LICENSE
      - src: README.md
        dst: /usr/share/doc/binpass/README.md
      # Completions land where each shell picks them up without the user
      # sourcing anything: the bash-completion directory is on bash's
      # default lookup path, zsh's site-functions is in fpath on every
      # distro that ships zsh, and fish loads vendor_completions.d at
      # startup. The file names must match the command: bash keys its
      # completions by command name, zsh by the underscore-prefixed one.
      - src: ./completions/binpass.bash
        dst: /usr/share/bash-completion/completions/binpass
      - src: ./completions/_binpass
        dst: /usr/share/zsh/site-functions/_binpass
      - src: ./completions/binpass.fish
        dst: /usr/share/fish/vendor_completions.d/binpass.fish

sboms:
  - id: archive
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  name_template: "binpass {{ .Version }}"
