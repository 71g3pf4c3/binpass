# golangci-lint configuration for binpassd.
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - revive
    - godot
    - misspell
    - unconvert
    - gosec
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters: [revive, godot, gosec]
      - path: gen/
        linters: [revive, godot, gosec, misspell]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
