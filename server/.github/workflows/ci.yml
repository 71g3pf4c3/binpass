# CI for the binpassd server: lint, unit tests, coverage gate, integration
# tests (with Docker/testcontainers), and a build check.
name: server-ci

on:
  push:
    branches: [server]
  pull_request:
    branches: [server]

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Unit + integration tests (testcontainers uses Docker)
        run: go test ./...
      - name: Coverage gate (business logic >=70%)
        env:
          CGO_ENABLED: "0"
        run: |
          go test -short -coverpkg=./internal/...,./pkg/... -coverprofile=coverage.out ./...
          grep -v -E '/gen/|_mock\.go' coverage.out > coverage.filtered || cp coverage.out coverage.filtered
          total=$(go tool cover -func=coverage.filtered | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "business-logic coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c+0 >= 70.0) ? 0 : 1 }' \
            || { echo "coverage ${total}% below 70% threshold"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Build binpassd
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/binpassd

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: server/go.sum
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
