# Continuous integration for the binpass client: lint, unit + race tests,
# a coverage gate, and a cross-platform build matrix.
#
# Every `uses:` is pinned to a full commit SHA with the human-readable tag in
# a trailing comment: a tag is mutable, so an upstream retag (or a
# compromised action repository) would otherwise run attacker-chosen code
# with this workflow's token. Bump by resolving the tag to a new SHA, never
# by loosening the pin.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      - name: go vet
        run: go vet ./...
      # Pinning by SHA is only a control while nothing reintroduces a mutable
      # `@v4`-style reference, which is easy to copy in from upstream docs.
      - name: Actions are pinned to commit SHAs
        run: |
          unpinned=$(grep -rnE '^[[:space:]]*(- )?uses:' .github/workflows \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::action reference not pinned to a commit SHA"
            echo "$unpinned"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Pinned, not "latest": v6 of the action cannot install golangci-lint
          # v2 at all (it rejected the v2.x version string, and its "latest"
          # resolved to a go1.24 build that refused to load a go.mod targeting
          # 1.26.5). v2.12.2 is what the nix dev shell ships, built with
          # go1.26.5.
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      # The golden tests compare binpass against the real thing; without
      # these they skip silently and prove nothing. rclone and restic are
      # the same deal for the transport tests: the advisory lock protocol
      # and the snapshot round trip need the real binaries.
      - name: Install the reference implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pass gnupg tree age rclone restic
          sudo sh scripts/install-sops.sh
      - name: Verify the reference tools are present
        run: |
          command -v pass || { echo "pass is missing: the golden suite would skip"; exit 1; }
          command -v tree || { echo "tree is missing: pass cannot render listings"; exit 1; }
          command -v rclone || { echo "rclone is missing: the transport tests would skip"; exit 1; }
          command -v restic || { echo "restic is missing: the snapshot tests would skip"; exit 1; }
          command -v sops || { echo "sops is missing: the sops suites would skip"; exit 1; }
          docker info >/dev/null || { echo "docker is missing: the MinIO container tests would skip"; exit 1; }
      - name: Unit tests with race detector
        run: go test -race ./...
      - name: Coverage gate (>=70%)
        env:
          CGO_ENABLED: "0"
        run: |
          go test -coverpkg=./pkg/...,./internal/... -coverprofile=coverage.out ./...
          grep -v -E '/mocks/|_mock\.go|/gen/' coverage.out > coverage.filtered
          total=$(go tool cover -func=coverage.filtered | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "business-logic coverage: ${total}%"
          awk -v c="$total" 'BEGIN { exit (c+0 >= 70.0) ? 0 : 1 }' \
            || { echo "coverage ${total}% below 70% threshold"; exit 1; }

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/binpass

  # Fuzzing found a path traversal in the sync transports and three separate
  # failures in the password hasher, so a short run guards every pull request.
  # The seed corpora in testdata keep those cases as permanent regressions;
  # this looks for the next one.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      - name: Fuzz every target briefly
        run: ./scripts/fuzz.sh 20
      - name: Keep the inputs that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The same suite on a plain Debian userland, against the distro's own pass.
  # This is what caught tree(1)'s locale- and TERM-dependent rendering, which
  # a NixOS-only run does not exercise.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test in a container
        run: |
          docker build -f Dockerfile.test -t binpass-test .
          docker run --rm binpass-test

  # The Secret Service provider is only useful if real clients can talk to
  # it, so this runs secret-tool from libsecret — what Chrome, VS Code and
  # NetworkManager use underneath — against it over a real session bus.
  secret-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Secret Service integration tests
        run: |
          docker build -f Dockerfile.ss -t binpass-ss .
          docker run --rm binpass-ss

  # The LUKS backend drives cryptsetup, mkfs and mount. The unit tests fake
  # the command runner and prove only that the right arguments are built;
  # this is where the backend meets the real tools, which needs a privileged
  # container and a kernel with dm-crypt.
  luks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: LUKS integration tests
        run: |
          sudo modprobe dm_crypt
          docker build -f Dockerfile.luks -t binpass-luks .
          docker run --rm --privileged binpass-luks

  # The rclone transports, the git remote and the restic snapshots skip
  # silently without their binaries, and the S3 tests skip without a Docker
  # daemon. The socket is mounted so the MinIO-backed tests run for real,
  # inside the same Debian userland users have.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Sync transport and snapshot integration tests
        run: |
          docker build -f Dockerfile.sync -t binpass-sync .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock binpass-sync

  # The clipboard backends and the typer tools are stub-tested in the unit
  # suite; this drives the real xclip, xsel, xdotool, xterm and dmenu on an
  # Xvfb display. The Wayland halves run in the e2e image instead.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The digest pin is the control: a bare `FROM golang:1.26-trixie` would
      # float the toolchain and the X11 packages under this suite again.
      - name: Base image is pinned by digest
        run: |
          grep -qE '^FROM .+@sha256:[0-9a-f]{64}$' Dockerfile.desktop \
            || { echo "::error::Dockerfile.desktop base image is not digest-pinned"; exit 1; }
      - name: Desktop integration tests
        run: |
          docker build -f Dockerfile.desktop -t binpass-desktop .
          docker run --rm binpass-desktop

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
      - name: Flake check
        run: nix flake check --no-build
      - name: Test in the dev shell
        run: nix develop --command go test ./...
