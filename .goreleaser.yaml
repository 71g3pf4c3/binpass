# GoReleaser configuration for the binpass client.
# Builds CGO-free, statically linked binaries for Linux, macOS, and Windows on
# amd64 and arm64, plus archives, checksums, and an SBOM.
# Docs: https://goreleaser.com
version: 2

project_name: binpass

before:
  hooks:
    - go mod tidy

builds:
  - id: binpass
    main: ./cmd/binpass
    binary: binpass
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildDate={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: binpass
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Distribution packages. The contrib launchers ship alongside the binary so
# that `binpass-rofi` and friends are on PATH after a package install.
nfpms:
  - id: binpass
    package_name: binpass
    vendor: 71g3pf4c3
    homepage: https://github.com/71g3pf4c3/binpass
    maintainer: 71g3pf4c3 <71g3pf4c3@gmail.com>
    description: |-
      A pass(1)-compatible password manager.
      Same storage format and command surface as pass, with age alongside GPG,
      hardware key support, and a built-in picker replacing rofi-pass/passmenu.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    # gnupg is only needed for .gpg stores, and age entries need nothing at
    # all, so it stays a recommendation rather than a hard dependency.
    recommends:
      - gnupg
    contents:
      - src: contrib/binpass-rofi
        dst: /usr/bin/binpass-rofi
        file_info:
          mode: 0755
      - src: contrib/binpass-fzf
        dst: /usr/bin/binpass-fzf
        file_info:
          mode: 0755
      - src: contrib/binpass-dmenu
        dst: /usr/bin/binpass-dmenu
        file_info:
          mode: 0755
      - src: LICENSE
        dst: /usr/share/doc/binpass/LICENSE
      - src: README.md
        dst: /usr/share/doc/binpass/README.md

sboms:
  - id: archive
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
  name_template: "binpass {{ .Version }}"
