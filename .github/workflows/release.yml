# Release the binpass client with GoReleaser on version tags (vX.Y.Z).
#
# Every `uses:` is pinned to a full commit SHA with the human-readable tag in
# a trailing comment. This job holds `contents: write` and `id-token: write`
# (cosign keyless), so a retagged upstream action would be able to publish
# and sign artefacts as this repository. Bump by resolving the tag to a new
# SHA, never by loosening the pin.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # A tag is not a promise that the tree is good: it can be pushed from a
  # branch CI never ran, or from a machine where the tests were skipped.
  # Nothing is published until the same suite that guards a pull request has
  # passed on the exact commit being released.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install the reference implementation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pass gnupg tree age

      - name: go vet
        run: go vet ./...

      - name: Tests with race detector
        run: go test -race ./...

      - name: Fuzz targets against their seed corpora
        run: go test ./... -run '^Fuzz' -count=1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # A release built from a tree whose go.mod needs tidying is not the tree
      # anyone reviewed.
      - name: go mod tidy is a no-op
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # The flake's version is what every nix-built binary reports; a tag
      # that disagrees with it publishes binaries misreporting themselves
      # (v0.2.0 shipped saying 0.1.0 exactly this way).
      - name: flake version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          flake="$(grep -m1 -oP '^\s*version = "\K[^"]+' flake.nix)"
          if [ "$tag" != "$flake" ]; then
            echo "::error::flake.nix says version \"$flake\" but the tag is $GITHUB_REF_NAME — bump the flake"
            exit 1
          fi

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release and upload assets
      id-token: write   # keyless signing with cosign
      attestations: write   # build provenance for the artefacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history for changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # Signatures are what let someone verify a download came from this
      # workflow rather than from whoever compromised the release page.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Provenance ties each binary to this workflow, this commit, and these
      # inputs, so a rebuilt or swapped artefact does not verify.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
